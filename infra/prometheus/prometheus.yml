global:
  scrape_interval: 5s

# Apps run on the host (pnpm dev); Prometheus runs in Docker, so it reaches them
# through host.docker.internal.
scrape_configs:
  - job_name: hexdispatch
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels: { app: gateway }
      - targets: ['host.docker.internal:3001']
        labels: { app: core-api }
      - targets: ['host.docker.internal:3002']
        labels: { app: location }
      - targets: ['host.docker.internal:3003']
        labels: { app: dispatch }
      - targets: ['host.docker.internal:3004']
        labels: { app: pricing }
      - targets: ['host.docker.internal:3005']
        labels: { app: payment }
