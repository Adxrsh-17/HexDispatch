<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexDispatch Realtime Driver Tracking</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 8px;
        color: #38bdf8;
      }
      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .connected {
        background: #166534;
        color: #86efac;
      }
      .disconnected {
        background: #991b1b;
        color: #fca5a5;
      }
      .card {
        background: #1e293b;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #334155;
      }
      #map-canvas {
        width: 100%;
        height: 350px;
        background: #090d16;
        border-radius: 6px;
        position: relative;
        overflow: hidden;
        border: 1px solid #334155;
      }
      .driver-marker {
        width: 20px;
        height: 20px;
        background: #38bdf8;
        border: 3px solid #ffffff;
        border-radius: 50%;
        position: absolute;
        transform: translate(-50%, -50%);
        transition: all 0.3s ease-out;
        box-shadow: 0 0 12px #38bdf8;
      }
      .log-box {
        height: 140px;
        overflow-y: auto;
        background: #0b0f19;
        padding: 10px;
        font-family: monospace;
        font-size: 13px;
        border-radius: 4px;
        border: 1px solid #222e44;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>HexDispatch Realtime Tracking</h1>
      <div id="status" class="status-badge disconnected">Disconnected</div>

      <div class="card">
        <div style="margin-bottom: 10px">
          <strong>Room:</strong> <span id="current-room">ride:demo-100</span> |
          <strong>Driver:</strong> <span id="driver-coords">Waiting for pings...</span>
        </div>
        <div id="map-canvas">
          <div id="marker" class="driver-marker" style="left: 50%; top: 50%; display: none"></div>
        </div>
      </div>

      <div class="card">
        <h3>Live Ingest & Fanout Log</h3>
        <div id="logs" class="log-box"></div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const markerEl = document.getElementById('marker');
      const coordsEl = document.getElementById('driver-coords');
      const logsEl = document.getElementById('logs');
      const room = 'ride:demo-100';

      function addLog(msg) {
        const p = document.createElement('div');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logsEl.prepend(p);
      }

      const wsUrl = `ws://${window.location.host}/ws?token=demo`;
      let ws;

      function connect() {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusEl.className = 'status-badge connected';
          statusEl.textContent = 'Connected (WebSocket)';
          addLog('Connected to Gateway WebSocket');
          ws.send(JSON.stringify({ type: 'subscribe', room }));
          addLog(`Subscribed to ${room}`);
        };

        ws.onclose = () => {
          statusEl.className = 'status-badge disconnected';
          statusEl.textContent = 'Disconnected (Reconnecting...)';
          addLog('WebSocket disconnected');
          setTimeout(connect, 3000);
        };

        ws.onmessage = (evt) => {
          try {
            const event = JSON.parse(evt.data);
            addLog(`Event [${event.type}] from ${event.room}`);
            if (event.data && event.data.lat !== undefined && event.data.lng !== undefined) {
              coordsEl.textContent = `Lat: ${event.data.lat.toFixed(4)}, Lng: ${event.data.lng.toFixed(4)} | Speed: ${event.data.speedMps ?? 0} m/s`;
              markerEl.style.display = 'block';
              // Simple visual normalization
              const x = ((event.data.lng - 77.5) * 800) % 100;
              const y = ((event.data.lat - 12.9) * 800) % 100;
              markerEl.style.left = `${Math.min(95, Math.max(5, Math.abs(x)))}%`;
              markerEl.style.top = `${Math.min(95, Math.max(5, Math.abs(y)))}%`;
            }
          } catch (e) {
            addLog(`Raw message: ${evt.data}`);
          }
        };
      }

      connect();
    </script>
  </body>
</html>
